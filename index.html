<body class="fz-landing fx-night" data-fx-intro>
<div id="demo"></div>
<div class="fz-themepos"><span data-theme-toggle></span></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <clipPath id="keelClip" clipPathUnits="objectBoundingBox"><path d="M0,1 L0,.42 C0,.17 .3,.07 .5,0 C.7,.07 1,.17 1,.42 L1,1 Z"/></clipPath>
</defs></svg>
<main class="fx-stage" data-fx-dust="120" data-fx-scene>
  <div class="fx-sky" aria-hidden="true"></div>
  <section class="fx-hero">
    <div class="fx-archwrap">
      <div class="fx-archbox" data-fx-arch="604" data-fx-dur="3.6"></div>
      <div class="fx-medal"><img src="assets/logo-qt-sm.png" alt="Qism al Tahfeez, Dar es Salaam"></div>
    </div>
    <div class="fx-copy">
      <h1 class="fx-title"><span>Qism al</span> <span>Tahfeez</span></h1>
      <p class="fx-sub">Dar es Salaam</p>
      <nav class="fx-gates" aria-label="Choose your portal">
        <a class="fx-gate" href="institute.html">
          <span class="fx-door-frame">
            <span class="fx-door-light" aria-hidden="true"></span>
            <span class="fx-door l" aria-hidden="true"></span><span class="fx-door r" aria-hidden="true"></span>
          </span>
          <svg class="fx-gate-line" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><path d="M2,150 L2,63 C2,27 31,12 50,2 C69,12 98,27 98,63 L98,150" pathLength="100"/></svg>
          <span class="fx-gate-name"><b>Institute</b></span>
        </a>
        <a class="fx-gate" href="student.html">
          <span class="fx-door-frame">
            <span class="fx-door-light" aria-hidden="true"></span>
            <span class="fx-door l" aria-hidden="true"></span><span class="fx-door r" aria-hidden="true"></span>
          </span>
          <svg class="fx-gate-line" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><path d="M2,150 L2,63 C2,27 31,12 50,2 C69,12 98,27 98,63 L98,150" pathLength="100"/></svg>
          <span class="fx-gate-name"><b>Student</b></span>
        </a>
      </nav>
      <div class="installbox" data-install></div>
    </div>
  </section>
</main>
