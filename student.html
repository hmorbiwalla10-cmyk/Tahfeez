<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tahfeez Daressalaam</title>
<meta name="theme-color" content="#D19B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest-student.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tahfeez Daressalaam">
<meta name="application-name" content="Tahfeez Daressalaam">

<link rel="stylesheet" href="css/fonts.css?v=43">
<link rel="stylesheet" href="css/style.css?v=43">
<style>
@media (min-width:640px){ body.in-app{background:var(--gold)} }
.sapp{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));position:relative}
@media (min-width:640px){ .sapp{box-shadow:0 0 0 1px rgba(255,255,255,.2),0 30px 80px rgba(60,35,5,.35)} }
.shead{padding:calc(16px + env(safe-area-inset-top,0px)) 18px 54px;border-radius:0 0 28px 28px}
.shead-top{display:flex;align-items:center;gap:10px}
.shead-top img{width:44px}
.shead-top b{font-family:var(--font-display);font-size:20px;line-height:1.1;flex:1}
.shead .iconbtn{color:var(--on-gold);background:rgba(255,255,255,.16)}
.shead .iconbtn:hover{background:rgba(255,255,255,.28)}
.hello{margin-top:22px}
.hello p{opacity:.92;font-size:14px}
.hello h1{font-family:var(--font-display);font-size:38px;line-height:1.1;overflow-wrap:anywhere}
.scontent{position:relative;z-index:1;padding:0 16px;margin-top:-34px;display:grid;gap:16px}
.status{background:var(--white);border-radius:22px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--gold-line);display:grid;gap:12px}
.status .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.status h2{font-family:var(--font-display);font-size:28px;line-height:1.1}
.status .state{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.status.paid .state{color:var(--good)}
.status.due .state{color:var(--warn)}
.status.overdue .state{color:var(--bad)}
.seal{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--good-bg);color:var(--good);border:2px solid currentColor}
.status.due .seal{background:var(--warn-bg);color:var(--warn)}
.status.overdue .seal{background:var(--bad-bg);color:var(--bad)}
.status.na .seal{background:var(--gold-soft);color:var(--gold-deep)}
.status .amt{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.status .meta{color:var(--ink-2);font-size:13.5px}
.box{background:var(--white);border-radius:20px;padding:18px;border:1px solid var(--gold-line);display:grid;gap:12px}
.box h3{font-family:var(--font-display);font-size:22px;line-height:1.1}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mo{border-radius:12px;padding:8px 2px;text-align:center;display:grid;gap:4px;justify-items:center;border:1px dashed var(--gold-line);background:transparent;font:inherit;color:var(--ink-2);cursor:default}
.mo b{font-size:12.5px}
.mo i{width:10px;height:10px;border-radius:50%;background:var(--gold-line)}
.mo.paid{background:var(--good-bg);border:1px solid transparent;color:var(--good);cursor:pointer}.mo.paid i{background:var(--good)}
.mo.overdue{background:var(--bad-bg);border:1px solid transparent;color:var(--bad)}.mo.overdue i{background:var(--bad)}
.mo.due{background:var(--warn-bg);border:1px solid transparent;color:var(--warn)}.mo.due i{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--gold-soft);border-radius:14px;padding:12px 14px}
.stats b{display:block;font-family:var(--font-display);font-size:clamp(18px,5vw,24px);line-height:1.15;overflow-wrap:anywhere}
.stats span{font-size:12.5px;color:var(--gold-dark);font-weight:600}
.hifz .bar{height:10px;border-radius:99px;background:var(--gold-soft);overflow:hidden}
.hifz .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:99px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--white);border:1px solid var(--gold-line);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.rcard:hover{border-color:var(--gold)}
.rcard .ic{width:46px;height:46px;border-radius:14px;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center;position:relative}
.rcard .ic .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--white)}
.rcard b{display:block;font-weight:700}
.rcard small{display:block;color:var(--ink-2);font-size:12.5px}
.rcard .amt{font-weight:700;text-align:right}
.rcard .amt small{font-weight:500}
.pagetitle{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 46px;border-radius:0 0 28px 28px}
.pagetitle h1{font-family:var(--font-display);font-size:36px;line-height:1.1}
.pagetitle p{opacity:.92}
.empty{border:1.5px dashed var(--gold-line);border-radius:18px;padding:30px 18px;text-align:center;color:var(--ink-2);background:var(--white)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.bnav-in{pointer-events:auto;width:100%;max-width:560px;background:var(--white);border-top:1px solid var(--gold-line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:14px;font-weight:700;font-size:12.5px;color:var(--ink-2);cursor:pointer;position:relative}
.bnav button[aria-current="page"]{color:var(--gold-deep);background:var(--gold-soft)}
.bnav .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-gold);font-size:11px;display:grid;place-items:center;padding:0 5px}
.hello .prog{margin-top:4px;font-size:13px;font-weight:600;opacity:.92}
.ratecta{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--white);border:1px solid var(--gold-line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.ratecta h3{font-family:var(--font-display);font-size:22px;line-height:1.15}
.ratecta .muted{font-size:13.5px}
.tcard .tini{font-weight:800;font-size:15px}
.tcard .todo{color:var(--warn);font-weight:600}
.srow{letter-spacing:1px;color:var(--gold-line)} .srow .on{color:var(--gold-deep)}
.qrow{display:grid;gap:4px;padding:10px 0;border-top:1px dashed var(--gold-line)}
.qrow:first-of-type{border-top:0}
.ql{font-weight:700;font-size:14px}
.ql .qd{display:block;font-weight:400;font-size:12.5px;line-height:1.4;color:var(--ink-2,#6b6459);margin-top:2px}
.rate{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{font-size:34px;line-height:1;color:var(--gold-line);cursor:pointer;padding:0 2px;transition:color .1s,transform .1s}
.rate label:hover,.rate label:hover~label,.rate input:checked~label{color:var(--gold-deep)}
.rate label:active{transform:scale(1.2)}
.rate input:focus-visible+label{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:4px}
textarea.input{resize:vertical;font:inherit}
.remind{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;background:var(--warn-bg);border:1px solid #EBD39A;border-radius:20px;padding:16px 18px}
.remind .rmsg{font-weight:600;margin-top:4px;color:var(--ink)}
.complete{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--white);border:2px solid var(--gold);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.complete h3{font-family:var(--font-display);font-size:22px;line-height:1.15}
.complete .muted{font-size:13.5px}
dl.info{margin:0;display:grid;background:var(--white);border:1px solid var(--gold-line);border-radius:14px;overflow:hidden}
dl.info div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--gold-line)}
dl.info div:first-child{border-top:0}
dl.info dt{color:var(--ink-2);font-size:13px}
dl.info dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.celebrate{text-align:center;color:var(--on-gold);display:grid;gap:6px;justify-items:center}
.celebrate .ring{width:72px;height:72px;border-radius:50%;background:var(--white);color:var(--good);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.25),0 12px 30px rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.celebrate .ring svg{width:34px;height:34px}
.celebrate b{font-family:var(--font-display);font-size:30px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.celebrate span{font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.scrim.gold{background:radial-gradient(circle at 50% 30%,rgba(209,155,91,.92),rgba(110,72,25,.92))}
.spark{position:fixed;z-index:42;top:-10px;width:8px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
/* keys */
.keys{border-radius:22px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);background:linear-gradient(145deg,#C58F4F,#D19B5B 45%,#B07C3E)}
.keyshead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.92}
.kbig{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1;margin-top:4px;text-shadow:0 2px 10px rgba(90,55,10,.25)}
.chest{display:grid;justify-items:center;gap:0;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:8px 14px;min-width:74px}
.chest b{font-family:var(--font-display);font-size:26px;line-height:1}
.chest small{font-size:11px;font-weight:700;opacity:.9}
.kbar{height:14px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.kbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFF6E6,#FFFFFF);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.knext{font-weight:700;font-size:14px}
.kways{display:flex;flex-wrap:wrap;gap:6px}
.kways span{font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px}
.goalnum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.goalnum b{font-family:var(--font-display);font-size:40px;line-height:1}
.goalnum span{color:var(--ink-2);font-weight:600}
.goalnum .pct{margin-left:auto;color:var(--gold-deep);font-weight:800}
.gbar,.qbar{position:relative;height:14px;border-radius:99px;background:var(--gold-soft);overflow:hidden}
.gbar i,.qbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gbar.done i{background:linear-gradient(90deg,#4FA36F,var(--good))}
.qbar{height:18px}
.qbar s{position:absolute;top:3px;bottom:3px;width:1.5px;background:rgba(255,255,255,.75);text-decoration:none}
.qticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:-6px}
.hchart{width:100%;height:auto;display:block}
.hchart .axis{stroke:var(--gold-line);stroke-width:1}
.hchart .b{fill:var(--gold-line)}
.hchart .b.now{fill:var(--gold-deep)}
.hchart .v{font-size:10px;fill:var(--ink-2);text-anchor:middle;font-weight:700;font-family:var(--font-ui)}
.hchart .m{font-size:10px;fill:var(--ink-2);text-anchor:middle;font-family:var(--font-ui)}
.kevs{display:grid}
.kev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed var(--gold-line);color:var(--gold-deep)}
.kev:first-child{border-top:0}
.kev .plus{font-weight:800;color:var(--good);min-width:40px}
.kev span:nth-child(2){color:var(--ink);font-weight:600}
.kev small{display:block;color:var(--ink-2);font-weight:400;font-size:12px}
/* reward */
.reward{position:relative;text-align:center;color:var(--on-gold);padding:36px 22px 22px;display:grid;gap:10px;justify-items:center;overflow:visible}
.rays{position:absolute;left:50%;top:70px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rbadge{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;color:var(--gold-deep);background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFF2DA 60%,#F2D7A8);box-shadow:0 0 0 10px rgba(255,255,255,.22),0 0 0 22px rgba(255,255,255,.1),0 20px 50px rgba(60,30,0,.45);animation:bounce 1.1s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounce{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.reward .rk{position:relative;margin-top:12px;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:999px}
.reward h2{position:relative;font-family:var(--font-display);font-size:40px;line-height:1.1;text-shadow:0 3px 16px rgba(60,30,0,.4);text-wrap:balance}
.reward .rtext{position:relative;font-size:16px;max-width:320px;text-shadow:0 1px 8px rgba(60,30,0,.4)}
.reward .rkeys{position:relative;display:inline-flex;gap:8px;align-items:center;font-family:var(--font-display);font-size:28px;font-weight:700}
.reward .rbtn{position:relative;margin-top:8px;background:var(--white);color:var(--gold-dark);border-color:var(--on-gold);font-size:16px;padding:13px}
.reward-scrim{background:radial-gradient(circle at 50% 30%,rgba(225,175,105,.97),rgba(110,70,20,.96))!important}
.doc{background:var(--white);border:1px solid var(--gold-line);border-radius:12px;padding:20px;overflow-x:auto;line-height:1.6}
.doc h1,.doc h2,.doc h3{font-family:var(--font-display);line-height:1.2;margin:.6em 0 .3em}
.doc p{margin:.5em 0}
.doc table{border-collapse:collapse;margin:.6em 0}
.doc td,.doc th{border:1px solid var(--gold-line);padding:6px 10px;vertical-align:top}
.doc img{max-width:100%;height:auto}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
/* page goal */
.pgoal{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--gold-soft);border-radius:14px;padding:12px 14px}
.pgoal>div{display:grid;text-align:center;flex:1}
.pgoal small{font-size:11.5px;font-weight:700;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.05em}
.pgoal b{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.pgoal b.now{color:var(--gold-deep)}
.pgoal .arrow{color:var(--gold);font-weight:800}
/* teacher's report */
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rstats div{background:var(--gold-soft);border-radius:14px;padding:10px 12px;display:grid}
.rstats b{font-size:26px;font-weight:800;color:var(--gold-dark);line-height:1.1}
.rstats span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ritem{display:grid;gap:4px}
.ritem p[lang=ar]{font-size:1.15em}
.jzs{display:flex;flex-wrap:wrap;gap:6px}
.jzs span{background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px}
/* ikhtibar */
.ikh .ikrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.ikh .ikrow .pname{display:grid;min-width:0}
.ikh .ikrow .pname small{color:var(--ink-2);font-size:12.5px}
.ikdate{width:48px;height:52px;border-radius:13px;background:var(--gold-soft);color:var(--gold-dark);display:grid;place-items:center;align-content:center;line-height:1}
.ikdate b{font-size:20px;font-weight:800}
.ikdate small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ikh .ikrow.next .ikdate{background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:#fff}
.ikh .ikrow.done{opacity:.85}
.ikh .ikrow.cancelled b{text-decoration:line-through}
/* my months */
.mlist{display:grid}
.mrow{border-top:1px solid var(--gold-line)}
.mrow:first-child{border-top:0}
.mrow summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
.mrow summary::-webkit-details-marker{display:none}
.mrow .mname{font-weight:700}
.mrow .mpages{color:var(--ink-2);font-size:13.5px}
.mrow dl.info{margin-bottom:10px}
.rcard .snip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .ic.fbadge{color:#fff;background:var(--fb)}
.kways span.neg{background:rgba(120,20,20,.28)}
.kev .plus.minus{color:var(--bad)}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lb li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#FCF8F2}
.lb li.m1{background:linear-gradient(90deg,#FFF1CC,#FCF8F2)}
.lb li.me{outline:2px solid var(--gold-deep);background:var(--gold-soft)}
.lbr{font-weight:800;text-align:center;font-size:16px;color:var(--ink-2)}
.lb li.m1 .lbr,.lb li.m2 .lbr,.lb li.m3 .lbr{font-size:20px}
.lbn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbn small{font-weight:600;color:var(--gold-deep)}
.lbk{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--gold-dark)}
.lbme{font-size:13.5px;margin:0;color:var(--ink-2)}
.juzbadge{display:grid;place-items:center}
.juzbadge b{font-family:var(--font-display);font-size:58px;line-height:1;color:var(--gold-dark)}
.pgoal.pos b{font-size:14.5px;line-height:1.25}
.pgoal.pos b.now{color:var(--gold-deep)}
.mtotals{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.mtotals div{background:var(--gold-soft);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.mtotals b{font-size:24px;font-weight:800;color:var(--gold-dark);line-height:1.1}
.mtotals b small{font-size:14px;opacity:.75}
.mtotals span{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.3}
</style>

<body>
<div id="demo"></div>

<div id="signin" class="auth" hidden>
  <div class="auth-art goldfield fx-night" data-fx-dust="70" data-fx-scene>
